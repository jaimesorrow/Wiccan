<text x="660" y="171" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#C7D6CA">●  ▣</text>
<path d="M163 201 L728 201" stroke="#496A59"/>
<text x="163" y="244" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#C7D6CA" letter-spacing="2">22 SEPTEMBER 2026</text>
<text x="163" y="281" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#E8CB90" letter-spacing="2">LESSON OF THE DAY</text>
<text x="163" y="342" font-family="DejaVu Serif" font-size="33" font-weight="bold" fill="#F8F3E9">The Wedjat Eye: Restoration</text>
<path d="M600 267 Q643 231 696 268 Q643 304 600 267 Z" fill="none" stroke="#E8CB90" stroke-width="2" opacity=".8"/>
<circle cx="648" cy="267" r="12" fill="none" stroke="#E8CB90" stroke-width="2"/>
<text x="163" y="406" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#C7D6CA" letter-spacing="0.6">ANCIENT EGYPTIAN</text>
<text x="163" y="432" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8CB90" letter-spacing="0.6">AMULET SYMBOLISM</text>
<path d="M163 464 L728 464" stroke="#496A59"/>
<text x="163" y="500" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8CB90" letter-spacing="1.5">INTRODUCTION</text>
<text x="163" y="528" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">An eye-shaped amulet can carry a story. The Met dates one</text>
<text x="163" y="555" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">gold wedjat eye (23.2.68) to the Ptolemaic period.</text>
<text x="163" y="599" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8CB90" letter-spacing="1.5">LESSON</text>
<text x="163" y="627" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">This object combines features of a human eye and a falcon's</text>
<text x="163" y="654" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">markings. In Egyptian myth, Horus's damaged eye was</text>
<text x="163" y="681" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">restored. An ancient wearer could regard the image as a sign</text>
<text x="163" y="708" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">of renewal and protection. This describes a belief, not a</text>
<text x="163" y="735" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">measured effect. An isolated object cannot tell us what its</text>
<text x="163" y="762" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">owner hoped for.</text>
<text x="163" y="806" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8CB90" letter-spacing="1.5">REFLECTION</text>
<text x="163" y="834" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">Modern reflection: What does repair look like in your life?</text>
<text x="163" y="878" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8CB90" letter-spacing="1.5">OPTIONAL PRACTICE</text>
<text x="163" y="906" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">Optional: Sketch a symbol for one small step you can take</text>
<text x="163" y="933" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#F8F3E9">today. This is your own exercise, not a reconstruction.</text>
<path d="M163 1332 L728 1332" stroke="#496A59"/>
<text x="163" y="1367" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#C7D6CA" letter-spacing="0.3">THE MET · OBJECT 23.2.68</text>
<rect x="163" y="1383" width="262" height="61" rx="18" fill="none" stroke="#E8CB90" stroke-width="2"/>
<text x="201" y="1422" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#E8CB90">View source   ↗</text>
<rect x="443" y="1383" width="285" height="61" rx="18" fill="#E8CB90"/>
<text x="479" y="1422" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#132923">Mark complete  ✓</text>
<rect x="368" y="1485" width="144" height="4" rx="2" fill="#C7D6CA" opacity=".7"/>
<rect x="835" y="100" width="660" height="1420" rx="44" fill="#30243A" stroke="#67546F" stroke-width="2"/>
<rect x="1117" y="116" width="96" height="6" rx="3" fill="#67546F"/>
<text x="888" y="171" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#D6C6D8">9:41</text>
<text x="1385" y="171" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#D6C6D8">●  ▣</text>
<path d="M888 201 L1453 201" stroke="#67546F"/>
<text x="888" y="244" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#D6C6D8" letter-spacing="2">23 SEPTEMBER 2026</text>
<text x="888" y="281" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#E8BDAC" letter-spacing="2">LESSON OF THE DAY</text>
<text x="888" y="342" font-family="DejaVu Serif" font-size="33" font-weight="bold" fill="#FBF4F2">Maqlû: Words and Instructions</text>
<rect x="1348" y="235" width="70" height="70" rx="8" fill="none" stroke="#E8BDAC" stroke-width="2" opacity=".8"/>
<path d="M1359 252 h45" stroke="#E8BDAC" stroke-width="2" opacity=".8"/>
<path d="M1359 270 h45" stroke="#E8BDAC" stroke-width="2" opacity=".8"/>
<path d="M1359 288 h45" stroke="#E8BDAC" stroke-width="2" opacity=".8"/>
<text x="888" y="406" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#D6C6D8" letter-spacing="0.6">ANCIENT MESOPOTAMIAN</text>
<text x="888" y="432" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8BDAC" letter-spacing="0.6">TEXTUAL HISTORY</text>
<path d="M888 464 L1453 464" stroke="#67546F"/>
<text x="888" y="500" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8BDAC" letter-spacing="1.5">INTRODUCTION</text>
<text x="888" y="528" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">Maqlû survives as a Mesopotamian anti-witchcraft series, not</text>
<text x="888" y="555" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">a modern spellbook.</text>
<text x="888" y="599" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8BDAC" letter-spacing="1.5">LESSON</text>
<text x="888" y="627" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">Its surviving form has eight incantation tablets and a ninth</text>
<text x="888" y="654" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">tablet with shorter directions. That division helps researchers</text>
<text x="888" y="681" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">examine the place of spoken words alongside prescribed</text>
<text x="888" y="708" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">actions. Modern editions reconstruct texts from manuscripts;</text>
<text x="888" y="735" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">one edited page cannot tell us how every person performed</text>
<text x="888" y="762" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">the ceremony. The texts frame misfortune as witchcraft: a</text>
<text x="888" y="789" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">historical belief, not evidence of a real assailant.</text>
<text x="888" y="833" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8BDAC" letter-spacing="1.5">REFLECTION</text>
<text x="888" y="861" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">Modern reflection: How does recording a practice change</text>
<text x="888" y="888" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">what later people can learn?</text>
<text x="888" y="932" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8BDAC" letter-spacing="1.5">OPTIONAL PRACTICE</text>
<text x="888" y="960" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">Optional: Write two columns: what you observed, and what</text>
<text x="888" y="987" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">you inferred. This is not an ancient ritual.</text>
<text x="888" y="1031" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#E8BDAC" letter-spacing="1.5">SAFETY NOTE</text>
<text x="888" y="1059" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">Historical fire and accusations against others are not</text>
<text x="888" y="1086" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#FBF4F2">instructions.</text>
<path d="M888 1332 L1453 1332" stroke="#67546F"/>
<text x="888" y="1367" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#D6C6D8" letter-spacing="0.3">CMAWRO · RITUAL TABLET Q002713</text>
<rect x="888" y="1383" width="262" height="61" rx="18" fill="none" stroke="#E8BDAC" stroke-width="2"/>
