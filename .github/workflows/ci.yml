name: CI
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # CI-only Firebase placeholder. It contains no real credentials and is
      # aligned to the canonical prod applicationId com.nyxwell.app.
      - run: cp app/google-services.ci.json app/google-services.json
      - run: ./gradlew ktlintCheck
      - run: ./gradlew :app:testProdDebugUnitTest
      - run: ./gradlew :app:assembleProdDebug
      # Compile the migration instrumentation tests even though this runner
      # has no emulator to execute connectedAndroidTest.
      - run: ./gradlew :app:compileProdDebugAndroidTestKotlin
      - run: ./gradlew :app:bundleProdRelease
      - run: ./scripts/check-16kb-alignment.sh
      # Internal security/release regressions fail CI; external Firebase,
      # signing and legal placeholders remain warnings until strict release.
      - run: bash ./scripts/play-preflight.sh

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
