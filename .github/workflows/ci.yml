name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-current:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require the PR branch to contain the latest base commit
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "refs/heads/$BASE_REF:refs/remotes/origin/pr-base"
          if ! git merge-base --is-ancestor refs/remotes/origin/pr-base HEAD; then
            echo "::error::Update this PR branch with the latest $BASE_REF and rerun CI."
            exit 1
          fi
          echo "PR branch includes $(git rev-parse refs/remotes/origin/pr-base)."
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      # Keep the fake root config as a build fallback. The checked-in
      # app/src/prod/google-services.json takes precedence for prod variants
      # and supplies their registered wiccan-android Firebase configuration.
      - run: cp app/google-services.ci.json app/google-services.json
      # Structural checks (identity drift across config files, conflict
      # markers, committed build output/secrets, missing referenced
      # scripts) plus release-preflight, which it runs internally. Cheap,
      # and catches a class of problem a green build cannot.
      - run: python3 scripts/test-check-toolchain.py
      - run: python3 scripts/check-toolchain.py
      - run: python3 scripts/test-validate-repo.py
      - run: python3 scripts/test-check-16kb-alignment.py
      - run: ./scripts/validate-repo.sh --structure
      - run: ./gradlew ktlintCheck
      # "prod" uses com.jaimesorrow.wiccan and its source-set Firebase config.
      # "dev"/"staging" are scaffolding
      # for real per-environment Firebase projects that don't exist yet
      # (see app/build.gradle.kts's productFlavors comment) and are not
      # built here.
      - run: ./gradlew :app:testProdDebugUnitTest
      - run: ./gradlew :app:assembleProdDebug
      # No emulator here, so this can't run the instrumented Room migration
      # test - it at least catches a compile regression in androidTest on
      # every push. Running it for real needs a connectedAndroidTest job
      # against an emulator, tracked as a known CI gap.
      - run: ./gradlew :app:compileProdDebugAndroidTestKotlin
      - run: ./gradlew :app:bundleProdRelease
      - run: ./gradlew :app:lintProdRelease
      # Android 15+ 16KB-page-size devices require every bundled 64-bit
      # native library's ELF LOAD segments to be 16KB-aligned.
      - run: ./scripts/check-16kb-alignment.sh

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: functions/package.json
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

  firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            firestore-tests/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix firestore-tests ci
      # Uses only demo-wiccan: no credentials, deployed data, or Functions
      # emulator required. Run actual Admin SDK transaction and rules tests.
      - run: npm --prefix firestore-tests test
