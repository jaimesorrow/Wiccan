name: CI
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # app/google-services.json is gitignored (holds real Firebase project
      # credentials) so it never exists on a fresh checkout - without it the
      # Google Services and Crashlytics Gradle plugins fail before any of
      # the steps below run. This CI-only placeholder has no real
      # credentials and is never used outside this workflow.
      - run: cp app/google-services.ci.json app/google-services.json
      - run: ./gradlew ktlintCheck
      # "prod" is the flavor whose applicationId (com.jaimesorrow.wiccan)
      # matches google-services.ci.json above - "dev"/"staging" are scaffolding
      # for real per-environment Firebase projects that don't exist yet
      # (see app/build.gradle.kts's productFlavors comment) and are not
      # built here.
      - run: ./gradlew :app:testProdDebugUnitTest
      - run: ./gradlew :app:assembleProdDebug
      # No emulator here, so this can't run the instrumented Room migration
      # test - it at least catches a compile regression in androidTest on
      # every push. Running it for real needs a connectedAndroidTest job
      # against an emulator, tracked as a known CI gap.
      - run: ./gradlew :app:compileProdDebugAndroidTestKotlin
      - run: ./gradlew :app:bundleProdRelease
      - run: ./gradlew :app:lintProdRelease
      # Android 15+ 16KB-page-size devices require every bundled 64-bit
      # native library's ELF LOAD segments to be 16KB-aligned.
      - run: ./scripts/check-16kb-alignment.sh

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
