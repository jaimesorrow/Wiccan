name: Release bundle

# Builds a signed, Play-uploadable .aab on a runner, so cutting a release
# does not require a local Android SDK install. The upload keystore lives
# only in repository secrets and in the runner's temp dir; it is never
# written into the repo and never printed to the log.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   RELEASE_KEYSTORE_PASSWORD  its store password
#   RELEASE_KEY_ALIAS          the key alias inside it
#   RELEASE_KEY_PASSWORD       that key's password
#
# Run it from the Actions tab ("Run workflow"), or push a v* tag. The signed
# .aab is attached to the run as a downloadable artifact.
#
# Unlike ci.yml this does not substitute google-services.ci.json: a release
# must be built against the real prod config committed at
# app/src/prod/google-services.json, not the CI placeholder.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      # Checked first: app/build.gradle.kts deliberately falls back to an
      # UNSIGNED release when no signing config is present, so a missing
      # secret would otherwise yield a bundle that looks fine and is only
      # rejected after being uploaded to Play.
      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing required secret(s):$missing" >&2
            echo "See docs/RELEASE_CHECKLIST.md for how to create the upload keystore." >&2
            exit 1
          fi

      - name: Write keystore and signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # A truncated or mis-pasted secret fails here, in seconds, rather
          # than minutes into the Gradle build with an opaque error.
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystore.properties

      # Supersedes a bare release-preflight run: this also catches identity
      # drift between app/build.gradle.kts and the google-services files,
      # which is exactly the kind of thing that ships a broken release.
      - run: ./scripts/validate-repo.sh --structure
      - run: python3 scripts/test-check-16kb-alignment.py

      # Every downloadable release must pass the app checks as well as
      # compile successfully; a manual/tag release cannot bypass CI.
      - run: ./gradlew ktlintCheck :app:testProdDebugUnitTest :app:compileProdDebugAndroidTestKotlin :app:lintProdRelease :app:bundleProdRelease

      # A signed .aab carries META-INF/<ALIAS>.SF and .RSA; an unsigned one
      # has neither. jarsigner is not the gate on its own: it exits 0 on an
      # unsigned bundle, so it would pass one straight through.
      - name: Verify the bundle is signed
        run: |
          aab=app/build/outputs/bundle/prodRelease/app-prod-release.aab
          [ -f "$aab" ] || { echo "No bundle produced at $aab" >&2; exit 1; }
          if ! unzip -l "$aab" | grep -qiE 'META-INF/.*\.(RSA|DSA|EC)$'; then
            echo "Bundle is NOT signed - refusing to publish it as a release artifact." >&2
            exit 1
          fi
          jarsigner -verify "$aab" | grep -q 'jar verified' || {
            echo "jarsigner could not verify the bundle's signature." >&2
            exit 1
          }
          echo "Signed and verified."

      - run: ./scripts/check-16kb-alignment.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wiccan-prod-release-aab
          path: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
          retention-days: 30

      # Runs even when an earlier step failed, so the key and its passwords
      # never outlive the job.
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" app/keystore.properties
