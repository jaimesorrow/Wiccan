name: Deploy launch site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "hosting/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      # Canonical host is Firebase Hosting at https://wiccan.app, where the
      # pages use root-absolute paths ("/styles.css"). GitHub Pages serves this
      # repo under /Wiccan/, so stage a copy with those paths prefixed.
      - name: Stage site for the /Wiccan/ project path
        run: |
          rm -rf _site
          cp -r hosting _site
          find _site -name '*.html' -exec sed -i -E 's#(href|src)="/#\1="/Wiccan/#g' {} +
          grep -rhoE '(href|src)="/[^"]*"' _site --include='*.html' | grep -v '^[a-z]*="/Wiccan/' && exit 1 || true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
