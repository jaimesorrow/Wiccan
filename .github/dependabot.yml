version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Keep runtime types on the deployed Node.js major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@firebase/rules-unit-testing"
        update-types: ["version-update:semver-major"]
    groups:
      firebase:
        patterns:
          - "firebase-*"
          - "@google-cloud/*"
          - "@googleapis/*"

  - package-ecosystem: "npm"
    directory: "/firestore-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@firebase/rules-unit-testing"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
